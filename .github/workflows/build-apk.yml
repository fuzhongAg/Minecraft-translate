name: 编译 APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      PIP_NO_BUILD_ISOLATION: '1'

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 安装 Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 彻底清理 Python 环境，只留 3.10
      run: |
        # 列出所有 Python 版本
        echo "=== 当前系统 Python ==="
        ls -la /usr/bin/python* 2>/dev/null || true
        which python3 && python3 --version || echo "python3 不存在"
        
        # 卸载所有 Python 3.11+
        echo "=== 卸载高版本 Python ==="
        sudo apt-get remove -y --purge python3.11 python3.11-minimal python3.11-venv python3.11-dev python3.11-distutils 2>/dev/null || true
        sudo apt-get remove -y --purge python3.12 python3.12-minimal python3.12-venv python3.12-dev 2>/dev/null || true
        sudo apt-get remove -y --purge python3.13 python3.13-minimal 2>/dev/null || true
        sudo apt-get remove -y --purge python3.14 python3.14-minimal 2>/dev/null || true
        sudo apt-get autoremove -y 2>/dev/null || true
        
        # 安装 Python 3.10
        echo "=== 安装 Python 3.10 ==="
        sudo apt-get update -y
        sudo apt-get install -y python3.10 python3.10-venv python3.10-dev python3.10-distutils python3-pip
        
        # 强制符号链接 python3 -> python3.10
        sudo ln -sf /usr/bin/python3.10 /usr/bin/python3
        sudo ln -sf /usr/bin/python3.10 /usr/bin/python
        
        # 安装所有编译依赖
        sudo apt-get install -y git zip openjdk-17-jdk \
          build-essential autoconf automake libtool libtool-bin pkg-config m4 gettext \
          zlib1g-dev libncurses5-dev libncursesw5-dev liblzma-dev \
          libffi-dev libssl-dev libbz2-dev libreadline-dev libsqlite3-dev tk-dev libgdbm-dev uuid-dev \
          libgl1-mesa-dev libgles2-mesa-dev libpango1.0-dev \
          libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libmtdev-dev libudev-dev libjpeg-dev
        
        # 验证
        echo "=== 最终验证 ==="
        echo "python3  路径: $(which python3)"
        echo "python3  版本: $(python3 --version)"
        echo "python   路径: $(which python)"
        echo "python   版本: $(python --version)"
        echo "剩余 Python 版本:"
        ls -la /usr/bin/python3.* 2>/dev/null || true

    - name: 安装 buildozer 和 python-for-android
      run: |
        python3 -m venv .venv
        . .venv/bin/activate
        echo "=== venv Python ==="
        python --version
        which python
        pip install --upgrade pip
        pip install setuptools==65.5.0 wheel
        pip install Cython==0.29.33 tempita
        pip install "git+https://github.com/kivy/buildozer.git@master#egg=buildozer"
        pip install "git+https://github.com/kivy/python-for-android.git@master#egg=python-for-android"

    - name: 编译 APK
      run: |
        . .venv/bin/activate
        export PATH="$PWD/.venv/bin:$PATH"
        echo "=== 编译环境确认 ==="
        python --version
        which python
        python -c "import cgi; print('cgi 模块可用')"
        cd app-src-android
        buildozer android debug

    - name: 上传 APK
      uses: actions/upload-artifact@v4
      with:
        name: MC自动中文化-APK
        path: app-src-android/bin/*.apk
        if-no-files-found: error
