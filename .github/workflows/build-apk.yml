name: 编译 APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 安装 Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 安装系统依赖
      run: |
        sudo apt-get update -y
        sudo apt-get install -y git zip openjdk-17-jdk python3.10 python3.10-venv python3.10-dev python3-pip python3-distutils \
          build-essential autoconf automake libtool libtool-bin pkg-config m4 gettext \
          zlib1g-dev libncurses5-dev libncursesw5-dev liblzma-dev \
          libffi-dev libssl-dev libbz2-dev libreadline-dev libsqlite3-dev tk-dev libgdbm-dev uuid-dev \
          libgl1-mesa-dev libgles2-mesa-dev libpango1.0-dev \
          libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libmtdev-dev libudev-dev libjpeg-dev

    - name: 安装 buildozer 到独立 virtualenv (使用 Python 3.10)
      run: |
        python3.10 -m venv .venv
        . .venv/bin/activate
        pip install --upgrade pip setuptools wheel
        pip install buildozer
        pip install Cython==0.29.33 tempita
        pip install --upgrade python-for-android
        pip install --upgrade "kivy==2.2.1"

    - name: 编译 APK (在 venv 中)
      run: |
        . .venv/bin/activate
        cd app-src-android
        buildozer android debug

    - name: 上传 APK
      uses: actions/upload-artifact@v4
      with:
        name: MC自动中文化-APK
        path: app-src-android/bin/*.apk
        if-no-files-found: error
