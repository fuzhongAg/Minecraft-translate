name: 编译 APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 安装 Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 安装系统依赖并强制 Python 3.10
      run: |
        # 卸载系统可能存在的 Python 3.11+，防止 buildozer 子进程误用
        sudo apt-get remove -y python3.12 python3.12-minimal python3.12-venv python3.12-dev 2>/dev/null || true
        sudo apt-get remove -y python3.11 python3.11-minimal 2>/dev/null || true
        # 安装 Python 3.10 及所有编译依赖
        sudo apt-get update -y
        sudo apt-get install -y git zip openjdk-17-jdk \
          python3.10 python3.10-venv python3.10-dev python3.10-distutils python3-pip \
          build-essential autoconf automake libtool libtool-bin pkg-config m4 gettext \
          zlib1g-dev libncurses5-dev libncursesw5-dev liblzma-dev \
          libffi-dev libssl-dev libbz2-dev libreadline-dev libsqlite3-dev tk-dev libgdbm-dev uuid-dev \
          libgl1-mesa-dev libgles2-mesa-dev libpango1.0-dev \
          libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libmtdev-dev libudev-dev libjpeg-dev
        # 强制 python3 指向 3.10（所有子进程都会用这个）
        sudo update-alternatives --install /usr/bin/python3 python3 /usr/bin/python3.10 100 2>/dev/null || true
        sudo update-alternatives --set python3 /usr/bin/python3.10 2>/dev/null || true
        # 验证
        echo "=== 系统 python3 版本 ==="
        python3 --version

    - name: 安装 buildozer 和 python-for-android
      run: |
        python3 -m venv .venv
        . .venv/bin/activate
        pip install --upgrade pip
        pip install setuptools==65.5.0 wheel
        pip install Cython==0.29.33 tempita
        pip install "git+https://github.com/kivy/buildozer.git@master#egg=buildozer"
        pip install "git+https://github.com/kivy/python-for-android.git@master#egg=python-for-android"

    - name: 编译 APK
      run: |
        . .venv/bin/activate
        export PATH="$PWD/.venv/bin:$PATH"
        cd app-src-android
        buildozer android debug

    - name: 上传 APK
      uses: actions/upload-artifact@v4
      with:
        name: MC自动中文化-APK
        path: app-src-android/bin/*.apk
        if-no-files-found: error
